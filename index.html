<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الإيقاعات التعليمي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>مولد الإيقاعات التعليمي 🎵</h1>

    <div class="controls">
        <button id="playBtn">تشغيل</button>
        <label>
            سرعة الإيقاع (BPM)
            <input type="number" id="bpm" value="120" min="60" max="200">
        </label>
        <label>
            عدد المربعات لكل صف
            <input type="number" id="stepsCount" value="16" min="4" max="64">
        </label>
    </div>

    <div id="sequencer"></div>

    <button id="addSound">➕ إضافة صوت</button>

</div>

<script src="https://unpkg.com/tone"></script>
<script src="app.js"></script>
</body>
</html>
